# Compila a versão offline e publica no Firebase Hosting a cada push na main.
# Secrets necessários (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  conteúdo do JSON da conta de serviço do Firebase
#   FIREBASE_PROJECT_ID       id do projeto (ex.: moworld-12345)
# Sem os secrets, o build roda mesmo assim e fica disponível para download.
name: Build e deploy offline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Regras do Firestore testadas no emulador: se falharem, nada é publicado.
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Testar regras do Firestore
        run: |
          mkdir -p /tmp/rt && cd /tmp/rt
          npm init -y > /dev/null
          npm i --no-audit --no-fund firebase-tools @firebase/rules-unit-testing firebase
          cp "$GITHUB_WORKSPACE/scripts/moworld/firestore-rules.test.mjs" t.mjs
          RULES_PATH="$GITHUB_WORKSPACE/firestore.rules" npx firebase emulators:exec \
            --project moworld-rules-test --only firestore "node --test t.mjs"

  build-deploy:
    needs: firestore-rules
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar npm 12
        run: npm i -g npm@12

      - name: Instalar dependências
        run: npm run inst

      - name: Build offline
        run: npm run build-offline

      - name: Guardar o build (baixável na aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: moworld-static
          path: static
          retention-days: 7

      - name: Publicar no Firebase
        if: env.HAS_FIREBASE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Publicar regras do Firestore
        if: env.HAS_FIREBASE == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools deploy --only firestore:rules \
            --project "$PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
