<!doctype html>
<html lang="pt-BR" class="h-full preload notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- O jogo já vem no idioma escolhido: sem oferta de tradução do Chrome. -->
    <meta name="google" content="notranslate" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title data-i18n="main.title">MoWorld</title>
    <link rel="manifest" href="<%- manifestHref %>" />
    <link rel="icon" type="image/svg+xml" href="<%- faviconHref %>" />
    <!-- iOS takes its home-screen icon from here before the manifest. Without it
         it picks the manifest's "any" icon and fills its transparent rounded
         corners with white; iOS rounds the corners itself, so use the
         full-bleed one. -->
    <link rel="apple-touch-icon" href="<%- appleTouchIconHref %>" />

    <!-- Preload styles -->
    <style>
      html {
        color-scheme: dark;
      }

      html.preload {
        visibility: visible !important;
        opacity: 1 !important;
        background-color: #111827 !important;
      }

      html.preload body {
        visibility: hidden;
        opacity: 0;
      }

      .preload {
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }

      /* iOS safe area support */
      body {
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }

      /* Prevent Playwire bottom rail from affecting flex layout,
         and keep it below the bottom HUD (z-[200]) so it can't cover the control panel */
      [id^="pw-oop-bottom_rail"] {
        position: fixed !important;
        z-index: 150 !important;
      }

      /* Playwire flex leaderboard (header ad): Playwire inlines
         z-index 2147483647 on it — cap it below modals and the mobile drawer,
         like the bottom rail. The sticky nav shifts below it via
         --top-ad-height, and page content via --top-ad-pad, both measured by
         HomepagePromos, so it never covers the menu bar. */
      #pw-oop-flex,
      #adBanner.leaderboard_ad {
        z-index: 150 !important;
      }

      /* Gutter rails (left/right) get the same inline max z-index, which put
         them over the featured Twitch player (z-[45000]) and its close
         button. Cap them like the other units. */
      [id^="pw-oop-left_rail"],
      [id^="pw-oop-right_rail"] {
        z-index: 150 !important;
      }

      /* The flex unit's inline (expanded) state renders into
         #pw-oop-flex_container, a direct <body> child. Body is a flex row,
         which squeezed it to width 0 — the unit could never show its
         expanded state or sense scrolling, so it latched permanently into
         the docked leaderboard. Give it its own full-width line at the top
         of the page (body wraps; the content area follows on the next
         line), so it expands at the top and docks once scrolled past.
         HomepagePromos locks its min-height to the expanded ad height once
         seen, so dock/undock never changes the document height (which would
         jump the scroll position mid-scroll). */
      #pw-oop-flex_container {
        order: -1;
        flex-basis: 100%;
        width: 100%;
      }
      /* While an inline page (store, settings, ...) is open the document is
         locked at scroll 0 (see styles.css), so the unit would sit expanded
         (350px tall) in flow above the modal for as long as the page is open,
         squeezing the modal to a sliver. Playwire docks the unit through an
         IntersectionObserver on this container, so park the container just
         above the viewport instead: the unit then collapses to its fixed
         leaderboard (measured into --top-ad-height, which pads the content
         area below), and re-expands in flow when the page closes. No
         transform here — the docked unit is position: fixed and must keep
         the viewport as its containing block. */
      body.page-open #pw-oop-flex_container {
        position: fixed;
        bottom: 100%;
        left: 0;
        width: 100%;
      }
      /* Playwire docks the unit with position: fixed and top: auto, i.e. at
         its static (in-flow) position — which is now above the viewport. */
      body.page-open #pw-oop-flex {
        top: 0;
      }

      /* Google Funding Choices CCPA link override */
      .fc-dns-link,
      .fc-ccpa-root,
      .fc-consent-root {
        position: fixed !important;
        z-index: 999999 !important;
      }
      .fc-dns-link {
        bottom: 15px !important;
        left: 15px !important;
      }

      /* Ensure full viewport height on iOS; body grows with content so the
         document scrolls (see styles.css) */
      html {
        height: 100%;
        height: -webkit-fill-available;
      }
      body {
        min-height: 100%;
        min-height: -webkit-fill-available;
      }

      /* Disable iOS double-tap "smart zoom" on the page; the game has its
         own map zoom. Panning/scrolling stays allowed. See issue #4609. */
      html,
      body {
        touch-action: manipulation;
      }
    </style>

    <!-- SEO -->
    <link rel="canonical" href="https://openfront.io/" />
    <meta
      name="description"
      content="Conquer the world in this multiplayer battle royale! Expand your nation, eliminate opponents, and dominate the map in this fast-paced IO game."
    />

    <!-- Open Graph -->
    <meta property="og:url" content="https://openfront.io/" />
    <meta property="og:title" content="MoWorld" />
    <meta
      property="og:description"
      content="Conquer the world in this multiplayer battle royale! Expand your nation, eliminate opponents, and dominate the map in this fast-paced IO game."
    />
    <meta property="og:image" content="<%- gameplayScreenshotUrl %>" />
    <meta property="og:type" content="game" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "MoWorld",
        "alternateName": "MoWorld",
        "url": "https://openfront.io/",
        "image": "<%- gameplayScreenshotUrl %>",
        "description": "Conquer the world in this multiplayer battle royale! Expand your nation, eliminate opponents, and dominate the map in this fast-paced IO game.",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "gamePlatform": ["Web Browser", "PC", "Mobile"],
        "genre": ["Strategy", "Multiplayer", "IO Game"],
        "playMode": "MultiPlayer",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "sameAs": [
          "https://github.com/openfrontio/OpenFrontIO",
          "https://discord.gg/openfront",
          "https://www.reddit.com/r/OpenFront/"
        ]
      }
    </script>

    <!--
      Injected from Server env.

      Every per-server value (cluster, instanceLetter, instanceId, serverHost,
      siteHost) is emitted through a guard so the whole line — indentation and
      trailing comma included — disappears when the renderer does not supply
      it. That is what lets one page be rendered per VERSION rather than per
      server and uploaded to the CDN (docs/MultiServer.md, "Publish pipeline
      (v2)"); a game server supplies them all and gets exactly the page it
      always served.

      Never add a placeholder the Steam shell does not supply: openfront-desktop
      renders this same template itself and a missing local is a ReferenceError,
      i.e. a blank window. Guarding an existing one is safe — the shell supplies
      a value and the line still emits.
    -->
    <script>
      window.BOOTSTRAP_CONFIG = {
        gitCommit: <%- gitCommit %>,
        assetManifest: <%- assetManifest %>,
        cdnBase: <%- cdnBase %>,
        gameEnv: <%- gameEnv %>,<%- typeof cluster !== "undefined" && cluster ? "\n        cluster: " + cluster + "," : "" %><%- typeof instanceLetter !== "undefined" && instanceLetter ? "\n        instanceLetter: " + instanceLetter + "," : "" %>
        turnstileSiteKey: <%- turnstileSiteKey %>,
        jwtAudience: <%- jwtAudience %>,<%- typeof stripePublishableKey !== "undefined" && stripePublishableKey ? "\n        stripePublishableKey: " + stripePublishableKey + "," : "" %><%- typeof faroCollectorUrl !== "undefined" && faroCollectorUrl ? "\n        faroCollectorUrl: " + faroCollectorUrl + "," : "" %><%- typeof instanceId !== "undefined" && instanceId ? "\n        instanceId: " + instanceId + "," : "" %><%- typeof serverHost !== "undefined" && serverHost ? "\n        serverHost: " + serverHost + "," : "" %><%- typeof siteHost !== "undefined" && siteHost ? "\n        siteHost: " + siteHost + "," : "" %>
      };
      // Set here rather than from the bundle so the first paint already has the
      // desktop layout. The shell's preload defines openfrontDesktop before
      // any page script runs. Steam only (isSteamShell): the Android app
      // defines it too, and lays out the way the site does in a mobile browser.
      // ?desktop-layout previews it outside prod.
      if (
        (window.openfrontDesktop && window.openfrontDesktop.steam) ||
        (window.BOOTSTRAP_CONFIG.gameEnv !== "prod" &&
          new URLSearchParams(location.search).has("desktop-layout"))
      ) {
        document.documentElement.classList.add("desktop-shell");
      }
      document.documentElement.style.setProperty(
        "--background-image-url",
        `url("<%- backgroundImageUrl %>")`,
      );
      document.documentElement.style.setProperty(
        "--mobile-logo-image-url",
        `url("<%- mobileLogoImageUrl %>")`,
      );
    </script>

    <script>
      // Poki allows no third-party scripts in its frame, so the ad, analytics
      // and CrazyGames scripts below load only off Poki (Turnstile still
      // loads: multiplayer joins need its token). Same check as
      // PokiSDK.isOnPoki(), which also keeps a positive answer in
      // sessionStorage for in-frame navigations.
      window.__onPoki = (function () {
        if (window.self === window.top) return false;
        try {
          if (sessionStorage.getItem("onPoki") === "true") return true;
        } catch (e) {}
        var pokiHost = /(^|\.)(poki\.com|poki-gdn\.com|poki\.dev)$/;
        function isPokiUrl(url) {
          try {
            return pokiHost.test(new URL(url).hostname);
          } catch (e) {
            return false;
          }
        }
        var ancestors = location.ancestorOrigins;
        return ancestors && ancestors.length > 0
          ? Array.prototype.some.call(ancestors, isPokiUrl)
          : isPokiUrl(document.referrer);
      })();
      window.__loadThirdPartyScript = function (src, attrs) {
        return; // OFFLINE: nenhum script de terceiros
        if (window.__onPoki) return;
        var script = document.createElement("script");
        script.src = src;
        script.async = true;
        for (var name in attrs || {}) script.setAttribute(name, attrs[name]);
        document.head.appendChild(script);
      };
    </script>

    <!-- CrazyGames SDK -->
    <script>
      // Not inside our VIVERSE wrapper, which isn't CrazyGames
      // even though it's an iframe. Same check as ViverseSDK.isOnViverse().
      window.__onViverse = (function () {
        if (window.self === window.top) return false;
        try {
          if (sessionStorage.getItem("onViverse") === "true") return true;
        } catch (e) {}
        var viverseHost = /(^|\.)(viverse\.app|viverse\.com)$/;
        function isViverseUrl(url) {
          try {
            return viverseHost.test(new URL(url).hostname);
          } catch (e) {
            return false;
          }
        }
        var ancestors = location.ancestorOrigins;
        return ancestors && ancestors.length > 0
          ? Array.prototype.some.call(ancestors, isViverseUrl)
          : isViverseUrl(document.referrer);
      })();
      if (!window.__onViverse) {
        __loadThirdPartyScript(
          "https://sdk.crazygames.com/crazygames-sdk-v3.js",
        );
      }
    </script>

    <!-- OFFLINE: bloqueio de rede. Só arquivos do próprio app (mesma origem)
         podem ser buscados; nenhum WebSocket abre. Assim nada sai do aparelho
         e as partes online falham na hora, sem ficar tentando reconectar. -->
    <script>
      (function () {
        var origin = location.origin;
        // MoWorld: além do próprio app, só o login Google e o banco do
        // Firebase (conta opcional). Anúncios e rastreamento seguem bloqueados.
        var allowedHosts = [
          /(^|\.)googleapis\.com$/,
          /^apis\.google\.com$/,
          /^accounts\.google\.com$/,
          /(^|\.)gstatic\.com$/,
          /^moworld-114d8\.(web\.app|firebaseapp\.com)$/,
        ];
        function local(u) {
          try {
            var url = new URL(u, location.href);
            if (url.origin === origin) return url.pathname.indexOf("/api/") === -1;
            if (url.protocol !== "https:") return false;
            return allowedHosts.some(function (re) { return re.test(url.hostname); });
          } catch (e) {
            return false;
          }
        }
        var realFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
          var u = typeof input === "string" ? input : input && input.url;
          if (!local(String(u))) {
            return Promise.reject(new TypeError("offline: " + u));
          }
          return realFetch(input, init);
        };
        var realBeacon = navigator.sendBeacon && navigator.sendBeacon.bind(navigator);
        navigator.sendBeacon = function (u, d) {
          return local(String(u)) && realBeacon ? realBeacon(u, d) : false;
        };
        var RealWS = window.WebSocket;
        function OfflineWS(u) {
          var ws = new RealWS("ws://0.0.0.0:9/");
          try { ws.close(); } catch (e) {}
          return ws;
        }
        OfflineWS.prototype = RealWS.prototype;
        OfflineWS.CONNECTING = 0; OfflineWS.OPEN = 1; OfflineWS.CLOSING = 2; OfflineWS.CLOSED = 3;
        window.WebSocket = OfflineWS;
        // Scripts e iframes externos (anúncios, SDKs) também não carregam.
        [HTMLScriptElement, HTMLIFrameElement].forEach(function (El) {
          var d = Object.getOwnPropertyDescriptor(El.prototype, "src");
          Object.defineProperty(El.prototype, "src", {
            get: d.get,
            set: function (v) {
              if (local(String(v))) d.set.call(this, v);
            },
            configurable: true,
          });
          var setAttr = El.prototype.setAttribute;
          El.prototype.setAttribute = function (n, v) {
            if (String(n).toLowerCase() === "src" && !local(String(v))) return;
            return setAttr.call(this, n, v);
          };
        });
      })();
    </script>
    <style>
      /* MoWorld: no PC (>=1280px) painel e construções numa barra só. */
      @media (min-width: 1280px) {
        .moworld-hud-grid { grid-template-columns: 1fr auto 1fr !important; }
        .moworld-hud-col { width: auto !important; }
        /* Notificações e chat acima da barra, à direita, sem empurrá-la. */
        .moworld-events {
          position: absolute !important;
          right: 1rem;
          bottom: calc(100% + 0.25rem);
          max-width: min(30rem, 40vw);
        }
        /* Só estiliza durante a partida (fora dela o painel fica vazio/oculto). */
        .moworld-bar:not(:has(> control-panel > div.hidden)) {
          flex-direction: row !important;
          align-items: center !important;
          gap: 0.5rem;
          padding: 0.5rem 0.75rem !important;
          margin-bottom: 0.5rem;
          border: 1px solid rgb(255 255 255 / 0.1);
          border-radius: 0.9rem !important;
          background: rgb(15 23 42 / 0.92) !important;
          box-shadow: 0 10px 30px rgb(0 0 0 / 0.45);
        }
        .moworld-bar > control-panel,
        .moworld-bar > unit-display { width: auto !important; }
        .moworld-bar .mw-unit-root {
          border-top: 0 !important;
          border-left: 1px solid rgb(255 255 255 / 0.1);
          padding-left: 0.5rem !important;
          width: auto !important;
        }
        .moworld-bar .unit-display-grid { gap: 0.3rem !important; }
        .moworld-bar .mw-unit-cell {
          position: relative;
          justify-content: center !important;
          width: 3.3rem !important;
          height: 3.5rem !important;
          border-radius: 0.6rem !important;
          border-color: rgb(255 255 255 / 0.1) !important;
          background: rgb(255 255 255 / 0.05);
        }
        .moworld-bar .mw-unit-inner {
          flex-direction: column !important;
          gap: 0.2rem !important;
          padding-top: 0.35rem !important;
        }
        .moworld-bar .mw-unit-icon { width: 1.5rem !important; height: 1.5rem !important; }
        .moworld-bar .mw-unit-hotkey {
          position: absolute !important;
          top: 2px; left: 4px; margin: 0 !important;
        }
        .moworld-bar .mw-unit-count {
          position: absolute; top: 2px; right: 4px;
          font-size: 10px !important; color: rgb(148 163 184);
        }
        .moworld-bar .mw-unit-cost { display: inline !important; }
      }
      /* Modo de construção ativo: destaque forte (toque de novo desliga). */
      .moworld-bar .mw-unit-active {
        border-color: #f59e0b !important;
        background: rgba(245, 158, 11, 0.22) !important;
        box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.55), 0 0 12px rgba(245, 158, 11, 0.45);
      }
      /* MoWorld: painéis da partida no mesmo padrão da barra de baixo
         (azul-marinho escuro, borda fina clara, cantos arredondados). */
      body.in-game .bg-gray-800\/92,
      body.in-game .bg-gray-800\/90,
      body.in-game .bg-gray-800\/70,
      body.in-game .bg-gray-800.backdrop-blur-sm {
        background-color: rgb(15 23 42 / 0.92) !important;
        border: 1px solid rgb(255 255 255 / 0.1);
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.4);
      }
      /* Painéis presos nas bordas viram cartões flutuantes. */
      body.in-game game-right-sidebar .bg-gray-800\/92,
      body.in-game game-left-sidebar .bg-gray-800\/92,
      body.in-game replay-panel .bg-gray-800\/92 {
        margin: 8px;
        border-radius: 0.9rem !important;
      }
      /* Alinhamento do topo: esquerda e direita com a mesma altura e o
         mesmo afastamento (8px) do painel do meio. */
      @media (min-width: 1024px) {
        body.in-game game-left-sidebar .bg-gray-800\/92 {
          position: relative;
          top: 8px;
          left: 8px;
          margin: 0 !important;
        }
      }
      /* Celular/tablet: o painel da esquerda é fixo no canto; mesmo
         afastamento do painel da direita (8px + área segura). */
      @media (max-width: 1023px) {
        body.in-game game-left-sidebar .bg-gray-800\/92 {
          top: calc(8px + env(safe-area-inset-top)) !important;
          left: calc(8px + env(safe-area-inset-left)) !important;
          margin: 0 !important;
        }
      }
      body.in-game game-left-sidebar .bg-gray-800\/92,
      body.in-game game-right-sidebar .bg-gray-800\/92 {
        min-height: 44px;
        justify-content: center;
      }
      body.in-game player-info-overlay .bg-gray-800\/92 {
        margin-top: 8px;
        border-radius: 0.9rem !important;
      }
      body.in-game attacks-display .bg-gray-800\/92 {
        border-radius: 0.7rem !important;
        margin-bottom: 4px;
      }
      @media (min-width: 640px) {
        body.in-game events-display .bg-gray-800\/92,
        body.in-game actionable-events .bg-gray-800\/92 {
          border-radius: 0.9rem !important;
        }
      }
      /* Botões e caixinhas internas: borda mais suave. */
      body.in-game game-left-sidebar .border-slate-500,
      body.in-game player-info-overlay .border-gray-500,
      body.in-game player-info-overlay .border-gray-600,
      body.in-game replay-panel .border-gray-500 {
        border-color: rgb(255 255 255 / 0.14) !important;
        border-radius: 0.5rem !important;
      }
      body.in-game game-left-sidebar .bg-gray-700\/50 {
        background-color: rgb(255 255 255 / 0.05) !important;
      }
      /* MoWorld: celular deitado — barra de ações no centro, mensagens no
         canto direito (menores) e o pop-up de alvo compacto no esquerdo. */
      @media (max-width: 1023px) and (orientation: landscape) {
        body.in-game .moworld-hud-grid {
          flex-direction: row !important;
          justify-content: center !important;
        }
        body.in-game .moworld-hud-col {
          margin-left: auto;
          margin-right: auto;
        }
        body.in-game .moworld-bar {
          border-top-left-radius: 0.9rem !important;
          border-top-right-radius: 0.9rem !important;
        }
        body.in-game .moworld-events {
          position: absolute !important;
          right: calc(4px + env(safe-area-inset-right));
          bottom: calc(100% + 4px);
          margin: 0 !important;
          align-items: flex-end !important;
          max-width: 55vw;
          transform: scale(0.8);
          transform-origin: bottom right;
        }
        body.in-game [data-moworld-target-popup] {
          left: calc(4px + env(safe-area-inset-left)) !important;
          transform: scale(0.8);
          transform-origin: bottom left;
        }
      }
      /* O pop-up de alvo é todo "fixed": o elemento em si não pode ocupar uma
         célula da grade do topo no PC (empurrava o painel da direita). */
      moworld-target-popup {
        display: contents;
      }
      /* MoWorld: contador de controle no topo, entre os painéis laterais. */
      moworld-control-bar {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        width: min(460px, calc(100vw - 500px));
        z-index: 40;
        pointer-events: none;
      }
      /* O painel do jogador (topo) desce para não cobrir o contador. */
      body.in-game player-info-overlay .bg-gray-800\/92 {
        margin-top: 76px !important;
        pointer-events: auto;
      }
      /* A margem acima do painel é área transparente do contêiner fixo:
         sem isso ela engole os toques nos botões do topo (celular em pé). */
      body.in-game player-info-overlay > div {
        pointer-events: none;
      }
      /* Celular em pé: largura toda, abaixo dos botões do topo. */
      @media (max-width: 767px) and (orientation: portrait) {
        moworld-control-bar {
          top: calc(60px + env(safe-area-inset-top));
          left: 8px;
          right: 8px;
          width: auto;
          transform: none;
        }
        body.in-game player-info-overlay .bg-gray-800\/92 {
          margin-top: 128px !important;
        }
      }
      /* Celular em pé (variante side-bar do jogo: <1024px e retrato):
         coluna de construção começa abaixo da barra de controle, termina
         acima da barra de baixo e usa botões mais baixos; aviso de pausa
         também desce para baixo da barra de controle. */
      @media (max-width: 1023px) and (orientation: portrait) {
        body.in-game {
          --mw-top-clear: calc(env(safe-area-inset-top) + 142px);
        }
        body.in-game .moworld-bar > unit-display {
          top: var(--mw-top-clear) !important;
          transform: none !important;
          translate: none !important;
        }
        body.in-game .moworld-bar .unit-display-scroll {
          max-height: calc(100dvh - var(--mw-top-clear) - 128px - env(safe-area-inset-bottom)) !important;
        }
        body.in-game .moworld-bar .mw-unit-cell {
          height: 2.4rem !important;
        }
        body.in-game .moworld-bar .mw-unit-cell img {
          width: 1.25rem !important;
          height: 1.25rem !important;
        }
        body.in-game .mw-headsup {
          top: var(--mw-top-clear) !important;
        }
      }
      /* PC: barra de controle com a mesma largura do cartão de informações
         do inimigo; empilhados (barra, cartão) e o aviso de pausa abaixo. */
      @media (min-width: 1024px) {
        moworld-control-bar {
          width: 500px;
        }
        body.in-game player-info-overlay .bg-gray-800\/92 {
          margin-top: 84px !important;
        }
        body.in-game .mw-headsup {
          top: 84px !important;
        }
        body.in-game:has(player-info-overlay .bg-gray-800\/92.visible) .mw-headsup {
          top: 164px !important;
        }
      }
      @media (min-width: 1200px) and (pointer: fine) {
        moworld-control-bar {
          width: 598px;
        }
      }
      /* Celular deitado: mais compacto no meio. */

    <!-- OFFLINE: service worker (PWA). Guarda o jogo no aparelho; nas
         atualizações baixa só o que mudou. A versão nova é aplicada fora da
         partida (recarrega a página sozinha) ou quando o jogador toca no
         aviso, nunca no meio de um jogo. Aviso discreto no canto inferior
         esquerdo. -->
    <script>
      if ("serviceWorker" in navigator && window.isSecureContext) {
        window.addEventListener("load", function () {
          var sw = navigator.serviceWorker;
          var toast = null, hideTimer = null, applying = false;
          function show(text, opts) {
            opts = opts || {};
            if (!toast) {
              toast = document.createElement("div");
              toast.style.cssText =
                "position:fixed;left:12px;z-index:2147483647;" +
                // No celular fica no alto (o rodapé ocupa o canto de baixo).
                (window.innerWidth < 640 ? "top:calc(env(safe-area-inset-top) + 64px);" : "bottom:12px;") +
                "background:rgba(15,23,42,.88);color:rgba(255,255,255,.88);" +
                "font:600 11px system-ui,sans-serif;padding:5px 10px;border-radius:999px;" +
                "border:1px solid rgba(255,255,255,.12)";
              document.body.appendChild(toast);
            }
            toast.textContent = text;
            toast.style.pointerEvents = opts.onClick ? "auto" : "none";
            toast.style.cursor = opts.onClick ? "pointer" : "default";
            toast.onclick = opts.onClick || null;
            clearTimeout(hideTimer);
            if (opts.hideAfter) hideTimer = setTimeout(hide, opts.hideAfter);
          }
          function hide() {
            if (toast) toast.remove();
            toast = null;
          }
          function inGame() {
            return document.body.classList.contains("in-game");
          }
          function apply(reg) {
            if (!reg.waiting) return;
            applying = true;
            show("↻ Atualizando…");
            reg.waiting.postMessage({ type: "skip-waiting" });
          }
          function offerUpdate(reg) {
            if (!reg.waiting) return;
            if (!inGame()) return apply(reg);
            show("Nova versão pronta · toque para atualizar", {
              onClick: function () { apply(reg); },
            });
          }
          sw.addEventListener("controllerchange", function () {
            if (applying) location.reload();
          });
          sw.addEventListener("message", function (e) {
            var d = e.data || {};
            if (d.type !== "moworld-sw") return;
            if (d.phase === "progress" && d.total) {
              var pct = Math.floor((d.done / d.total) * 100);
              show((d.update ? "↓ Atualizando " : "↓ Offline ") + pct + "%");
            } else if (d.phase === "installed" && !d.update) {
              show("✓ Pronto para jogar offline", { hideAfter: 3000 });
            } else if (d.phase === "installed" && d.update) {
              sw.getRegistration().then(function (reg) { reg && offerUpdate(reg); });
            }
          });
          sw.register("/sw.js").then(function (reg) {
            // Versão nova já baixada de uma visita anterior: aplica agora.
            if (reg.waiting) offerUpdate(reg);
            // Procura atualização a cada 30 min enquanto o app fica aberto.
            setInterval(function () { reg.update().catch(function () {}); }, 30 * 60 * 1000);
          }).catch(function (err) {
            console.warn("Service worker falhou", err);
          });
        });
      }

    <script>
      // Fallback sidebar toggle so hamburger works even if module bundle fails to load
      window.__toggleSidebar = function (e) {
        try {
          const sidebar = document.getElementById("sidebar-menu");
          const backdrop = document.getElementById("mobile-menu-backdrop");
          if (!sidebar || !backdrop) return;

          const isOpen = sidebar.classList.contains("open");

          if (isOpen) {
            sidebar.classList.remove("open");
            backdrop.classList.remove("open");
            document.documentElement.classList.remove("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "true");
            sidebar.removeAttribute("aria-modal");
            backdrop.setAttribute("aria-hidden", "true");
          } else {
            sidebar.classList.add("open");
            backdrop.classList.add("open");
            document.documentElement.classList.add("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "false");
            sidebar.setAttribute("aria-modal", "true");
            backdrop.setAttribute("aria-hidden", "false");
          }

          const hb = document.getElementById("hamburger-btn");
          if (hb) hb.setAttribute("aria-expanded", (!isOpen).toString());
        } catch (err) {
          console.error("Toggle failed", err);
        }
      };

      // Wire up the hamburger button inline
      const hamburger = document.getElementById("hamburger-btn");
      if (hamburger) {
        hamburger.onclick = window.__toggleSidebar;
        hamburger.setAttribute("aria-expanded", "false");
      }

      // Wire up backdrop click to close menu
      const backdrop = document.getElementById("mobile-menu-backdrop");
      if (backdrop) {
        backdrop.onclick = function (e) {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        };
      }

      // Wire up Escape key to close menu
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" || e.key === "Esc") {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        }
      });
    </script>
